services:
  app:
    build: .
    ports:
      - '8000:8000'
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: ${LOCAL_DB_URL}
      DB_USERNAME: ${LOCAL_DB_USER}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1026
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - mailpit
      - redis

  postgres:
    image: 'postgres:latest'
    container_name: 'booking-backend'
    environment:
      - 'POSTGRES_DB=$LOCAL_DB_NAME'
      - 'POSTGRES_PASSWORD=$LOCAL_DB_PASSWORD'
      - 'POSTGRES_USER=$LOCAL_DB_USER'
    ports:
      - '5433:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/'
  redis:
    image: 'redis:latest'
    container_name: "booking-redis"
    ports:
      - '6379:6379'

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: 'booking-mailpit'
    ports:
      - '1026:1025'
      - '8026:8025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data: