spring:
  application:
    name: vaya-backend
  profiles:
    active: local

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1026}
#    username: ${MAIL_USERNAME}
#    password: {MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
        debug: false

